{% extends "base.html" %}
{% block title %}Reset Password - Quiz Master Pro{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="glass auth-card fade-up">
        <h1><i class="fa-solid fa-shield-halved"></i> Reset Password</h1>
        <p class="sub">Use the reset code we "emailed" you and choose a new password.</p>
        <form method="post" action="{{ url_for('auth.reset') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="code">Reset Code</label>
                <input class="input" type="text" id="code" name="code" placeholder="e.g. Ab3dEf9x" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">New Password</label>
                <div class="input-wrapper">
                    <input class="input" type="password" id="password" name="password" placeholder="At least 6 characters" required>
                    <button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm New Password</label>
                <div class="input-wrapper">
                    <input class="input" type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your new password" required>
                    <button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
            <button class="btn btn-block" type="submit"><i class="fa-solid fa-check"></i> Update Password</button>
        </form>
        <div class="auth-alt"><a href="{{ url_for('auth.login') }}">Back to login</a></div>
    </div>
</div>
{% endblock %}
