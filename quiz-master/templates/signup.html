{% extends "base.html" %}
{% block title %}Sign Up - Quiz Master Pro{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="glass auth-card fade-up">
        <h1><i class="fa-solid fa-user-plus"></i> Create Account</h1>
        <p class="sub">Start at Level 1 and unlock your way to the top.</p>
        <form method="post" action="{{ url_for('auth.signup') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input class="input" type="text" id="username" name="username" value="{{ username or '' }}" placeholder="3-20 letters, numbers or _" required autofocus>
            </div>
            <div class="form-group">
                <label for="email">Email</label>
                <input class="input" type="email" id="email" name="email" value="{{ email or '' }}" placeholder="you@example.com" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input class="input" type="password" id="password" name="password" placeholder="At least 6 characters" required>
                    <button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <div class="input-wrapper">
                    <input class="input" type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required>
                    <button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
            <button class="btn btn-block" type="submit"><i class="fa-solid fa-user-check"></i> Create Account</button>
        </form>
        <div class="auth-alt">Already have an account? <a href="{{ url_for('auth.login') }}">Login</a></div>
    </div>
</div>
{% endblock %}
