{% extends "base.html" %}
{% block title %}Login - Quiz Master Pro{% endblock %}
{% block content %}
<div class="auth-wrap">
    <div class="glass auth-card fade-up">
        <h1><i class="fa-solid fa-arrow-right-to-bracket"></i> Welcome Back</h1>
        <p class="sub">Log in to continue your quiz journey.</p>
        <form method="post" action="{{ url_for('auth.login') }}" novalidate>
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
            <div class="form-group">
                <label for="username">Username or Email</label>
                <input class="input" type="text" id="username" name="username" value="{{ identifier or '' }}" placeholder="e.g. quizmaster" required autofocus>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <input class="input" type="password" id="password" name="password" placeholder="Your password" required>
                    <button type="button" class="toggle-pass" aria-label="Show password"><i class="fa-solid fa-eye"></i></button>
                </div>
            </div>
            <button class="btn btn-block" type="submit"><i class="fa-solid fa-right-to-bracket"></i> Login</button>
        </form>
        <div class="auth-alt">
            <a href="{{ url_for('auth.forgot') }}">Forgot password?</a> &middot;
            New here? <a href="{{ url_for('auth.signup') }}">Create an account</a>
        </div>
    </div>
</div>
{% endblock %}
